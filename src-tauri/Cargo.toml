[package]
name = "app"
version = "2.0.0"
description = ""
authors = ["wlg-shinya"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["image-ico"] }
tauri-plugin-log = "2"
quick-xml = "0.39.4"
chrono = "0.4.45"
notify = "8.2.0"
